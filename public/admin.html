<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA TECH Admin</title><link rel="stylesheet" href="/style.css"></head><body class="admin"><header><a class="brand" href="/"><span class="logoRing"><img src="/assets/nexora-web-logo.svg"></span><span>NEXORA <b>ADMIN</b></span></a></header><main class="adminWrap"><section id="login"><h1>Admin Control Center</h1><p>Manage products and store data.</p><input id="user" value="admin"><input id="pass" type="password" placeholder="Admin password"><button class="btn primary" id="loginBtn">Sign in</button><small>Default development password: change-me</small></section><section id="panel" hidden><div class="sectionHead"><div><p class="eyebrow">CONTROL CENTER</p><h1>Product Management</h1></div><a href="/">Open Store →</a></div><form id="productForm" class="adminForm"><input name="name" placeholder="Product name" required><input name="category" placeholder="Category" required><input name="brand" placeholder="Brand"><input name="price" type="number" placeholder="Price" required><input name="oldPrice" type="number" placeholder="Old price"><input name="stock" type="number" placeholder="Stock"><input name="image" placeholder="Image URL"><button class="btn primary">Add Product</button></form><pre id="adminOut"></pre></section></main><script src="/admin.js" defer></script></body></html>
