<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA TECH Admin</title><link rel="stylesheet" href="/style.css"></head>
<body class="adminBody"><header class="adminHeader"><a class="brand" href="/"><span class="brandLogo">N</span><span><b>NEXORA</b><em>ADMIN</em></span></a><button id="adminLogout" class="btn ghost">Logout</button></header>
<div class="adminLayout"><aside class="adminSide"><button data-view="dashboard" class="active">Dashboard</button><button data-view="products">Products</button><button data-view="services">Services</button><button data-view="packages">Packages</button><button data-view="portfolio">Portfolio</button><button data-view="reviews">Reviews</button><button data-view="orders">Orders</button><button data-view="contacts">Contacts</button><button data-view="settings">Website Settings</button></aside>
